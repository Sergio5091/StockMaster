# ═══════════════════════════════════════════════════════
# Configuration TEST - StockMaster
# ═══════════════════════════════════════════════════════

# Datasource - H2 en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true

# Configuration JWT (clés de test)
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHk=
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=7200000

# Logging
logging.level.root=ERROR
logging.level.com.backend.stockmaster=DEBUG

# Seed activé pour les tests
app.seed.enabled=true

# Mail désactivé pour les tests
app.alerts.mail.enabled=false
