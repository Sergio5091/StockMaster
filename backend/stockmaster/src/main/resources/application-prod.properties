# ═══════════════════════════════════════════════════════
# Configuration PRODUCTION - StockMaster
# ═══════════════════════════════════════════════════════

# Datasource
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/stockmaster_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Configuration JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000
app.jwt.refresh-expiration-ms=604800000

# OpenAPI / Swagger - DÉSACTIVÉ EN PRODUCTION
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.backend.stockmaster=INFO
logging.file.name=logs/stockmaster-prod.log

# Sécurité - Désactiver le seed
app.seed.enabled=false

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.alerts.mail.enabled=${ALERTS_MAIL_ENABLED:true}
app.alerts.mail.recipient=${ALERTS_MAIL_RECIPIENT:admin@stockmaster.com}
