spring.application.name=stockmaster

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/stockmaster_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuration JWT
app.jwt.secret=c3RvY2ttYXN0ZXItc2VjcmV0LWtleS12ZXJ5LWxvbmctYW5kLXNlY3VyZWQ=
app.jwt.expiration-ms=28800000
app.jwt.refresh-expiration-ms=604800000

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# Port du serveur
server.port=8080

# ───────────────────────────────────────────────────────
# Mail (désactivé par défaut - configurer pour activer)
# ───────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre_email@gmail.com
spring.mail.password=votre_mot_de_passe_app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Destinataire des alertes mail
app.alerts.mail.enabled=false
app.alerts.mail.recipient=admin@stockmaster.com
